name: Deploy App Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v
        env:
          TESTING: true
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: "c097acfcccf2d5622ddfd05353e5c93d7645f8c91eebdd3093aae0d2571b61fc"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_HOURS: "1"
          ALLOWED_ORIGINS: "http://localhost:3000"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sets up environment context variables while pointing to your unified registry
      - name: Set Environment Variables
        id: env_setup
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag_prefix=prod" >> $GITHUB_OUTPUT
            echo "service_name=syncspace-backend-prod" >> $GITHUB_OUTPUT
          else
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
            echo "service_name=syncspace-backend-dev" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Builds and pushes directly into the syncspace-dev repository folder using custom tags
      - name: Build and Push Docker Image
        run: |
          docker build -t asia-southeast1-docker.pkg.dev/syncspace-backend/syncspace-dev/syncspace-backend:${{ steps.env_setup.outputs.tag_prefix }}-${{ github.sha }} ./backend
          docker push asia-southeast1-docker.pkg.dev/syncspace-backend/syncspace-dev/syncspace-backend:${{ steps.env_setup.outputs.tag_prefix }}-${{ github.sha }}

      # Triggers deployment targeting the environment-specific Cloud Run service instance
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ steps.env_setup.outputs.service_name }} \
            --image=asia-southeast1-docker.pkg.dev/syncspace-backend/syncspace-dev/syncspace-backend:${{ steps.env_setup.outputs.tag_prefix }}-${{ github.sha }} \
            --region=asia-south1 \
            --project=syncspace-backend \
            --platform=managed
